<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xprinter TSPL Этикетки</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 15px; background: #eceff1; color: #333; }
        .input-group { margin: 10px auto; max-width: 300px; text-align: left; }
        label { font-size: 14px; font-weight: bold; display: block; margin-bottom: 5px; }
        input { width: 100%; padding: 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; max-width: 300px; padding: 12px; font-size: 16px; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        .btn-generate { background: #0288d1; }
        .btn-copy { background: #2e7d32; display: none; }
        #receipt-preview { background: #ffff8d; padding: 15px; margin: 20px auto; max-width: 300px; border: 1px dashed #000; text-align: left; font-family: monospace; font-size: 14px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        #tspl-output { width: 100%; max-width: 300px; height: 100px; margin: 15px auto; display: none; font-family: monospace; font-size: 12px; padding: 10px; box-sizing: border-box; }
    </style>
</head>
<body>

    <h2>Xprinter 365b — Этикетка TSPL</h2>
    
    <div class="input-group">
        <label>Штрих-код товара:</label>
        <input type="text" id="barcode-input" placeholder="Введите код" oninput="updatePreview()">
    </div>

    <div class="input-group">
        <label>Название товара:</label>
        <input type="text" id="name-input" value="Новый продукт" oninput="updatePreview()">
    </div>

    <div class="input-group">
        <label>Цена (руб.):</label>
        <input type="number" id="price-input" value="100.00" oninput="updatePreview()">
    </div>
    
    <div id="receipt-preview">
        <center><b>ООО "МАГАЗИН"</b></center>
        <p style="margin:5px 0;">---------------------------</p>
        <p style="margin:5px 0;">ТОВАР: <span id="preview-name">Новый продукт</span></p>
        <p style="margin:5px 0;">КОД: <span id="preview-code">----------</span></p>
        <p style="margin:5px 0;">ЦЕНА: <span id="preview-price">100.00</span> РУБ.</p>
        <p style="margin:5px 0;">---------------------------</p>
    </div>

    <button class="btn-generate" onclick="generateTSPL()">1. Сформировать этикетку</button>
    <textarea id="tspl-output" readonly></textarea>
    <button class="btn-copy" id="copy-btn" onclick="copyToClipboard()">2. Скопировать код печати</button>

    <script>
        function updatePreview() {
            let code = document.getElementById('barcode-input').value;
            let name = document.getElementById('name-input').value;
            let price = document.getElementById('price-input').value;

            document.getElementById('preview-code').innerText = code ? code : "----------";
            document.getElementById('preview-name').innerText = name ? name : "Без названия";
            document.getElementById('preview-price').innerText = price ? parseFloat(price).toFixed(2) : "0.00";
        }

        function generateTSPL() {
            let code = document.getElementById('barcode-input').value;
            let name = document.getElementById('name-input').value;
            let price = document.getElementById('price-input').value;

            if(!code) { alert("Пожалуйста, введите штрих-код товара!"); return; }
            
            let formattedPrice = parseFloat(price).toFixed(2);

            // Чистый TSPL код для принтера этикеток
            let tsplText = "SIZE 58 mm, 40 mm\r\n" +
                           "GAP 2 mm, 0 mm\r\n" +
                           "DIRECTION 1\r\n" +
                           "CLS\r\n" +
                           "TEXT 30,30,\"3\",0,1,1,\"OOO MAGAZIN\"\r\n" +
                           "TEXT 30,70,\"3\",0,1,1,\"TOVAR: " + name + "\"\r\n" +
                           "TEXT 30,110,\"3\",0,1,1,\"PRICE: " + formattedPrice + " RUB\"\r\n" +
                           "BARCODE 30,160,\"128\",60,1,0,2,2,\"" + code + "\"\r\n" +
                           "PRINT 1,1\r\n";
            
            let output = document.getElementById('tspl-output');
            output.value = tsplText;
            output.style.display = "block";
            document.getElementById('copy-btn').style.display = "block";
        }

        function copyToClipboard() {
            let output = document.getElementById('tspl-output');
            output.select();
            output.setSelectionRange(0, 99999);
            navigator.clipboard.writeText(output.value);
            alert("Код этикетки скопирован! Теперь вставьте его в RawBT.");
        }
    </script>
</body>
</html>
